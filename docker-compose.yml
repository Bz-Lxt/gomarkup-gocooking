services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gocooking
      POSTGRES_PASSWORD: gocooking
      POSTGRES_DB: gocooking
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "27343:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocooking -d gocooking"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gocooking

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://gocooking:gocooking@postgres:5432/gocooking?sslmode=disable
      JWT_SECRET: gocooking-dev-jwt-secret-change-me
    ports:
      - "27342:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 8
    networks:
      - gocooking

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    ports:
      - "27341:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 8
    networks:
      - gocooking

volumes:
  pgdata:

networks:
  gocooking:
    driver: bridge
